version: 2

seeds:
  - name: netflix_titles
    description: >
      Raw Netflix titles dataset loaded as a dbt seed.
      Exported by main.py after basic cleaning from the source CSV.
    columns:
      - name: show_id
        description: "Unique identifier for each title (e.g. s1, s2...)."
      - name: title
        description: "Title of the Netflix show or movie."
        tests:
          - not_null
      - name: type
        description: "Content type: Movie or TV Show."
        tests:
          - accepted_values:
              arguments:
                values: ['Movie', 'TV Show']
      - name: country
        description: "Country where the title was produced. May be empty."
      - name: release_year
        description: "Year the title was originally released."
      - name: date_added
        description: "Date the title was added to Netflix (raw string, e.g. 'January 1, 2020')."
      - name: listed_in
        description: "Comma-separated list of genres."
      - name: description
        description: "Short synopsis of the title."